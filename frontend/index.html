<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSL Musical — Compilador</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="title-row">
    <h1>DSL Musical</h1>
    <span class="tag">compilador</span>
  </div>
  <svg class="staff" viewBox="0 0 600 26" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="2" x2="600" y2="2"></line>
    <line x1="0" y1="8" x2="600" y2="8"></line>
    <line x1="0" y1="14" x2="600" y2="14"></line>
    <line x1="0" y1="20" x2="600" y2="20"></line>
    <line x1="0" y1="26" x2="600" y2="26"></line>
    <circle cx="40" cy="14" r="3"></circle>
    <circle cx="120" cy="8" r="3"></circle>
    <circle cx="200" cy="20" r="3"></circle>
    <circle cx="280" cy="2" r="3"></circle>
    <circle cx="360" cy="14" r="3"></circle>
  </svg>
</header>

<main>
  <section>
    <div class="pane-head">
      <span>Codigo .mus</span>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="run-btn" id="btnCompilar">Compilar &#9658;</button>
        <button class="ghost-btn" id="btnForceCompile" style="display:inline-flex;">Forzar compilación</button>
        <span id="positionIndicator" class="status" style="margin-left:8px; white-space:nowrap;">L1:C1</span>
      </div>
    </div>
    <div class="editor-wrap">
      <div class="highlight-layer" id="highlightLayer"></div>
      <textarea id="editor" spellcheck="false">HOJA A4
TITULO "Cancion Facil"
AUTOR "Emerson"

PENTAGRAMA 1
CLAVE SOL
COMPAS 4/4
INSTRUMENTO PIANO

DO:NEGRA
RE:NEGRA
MI:NEGRA
SOL:NEGRA |

LA:BLANCA
SI:CORCHEA
DO:CORCHEA
RE:NEGRA |

SOL:BLANCA |
</textarea>
    </div>
  </section>

  <section>
    <div class="pane-head">
      <span>Resultados</span>
      <div class="right">
        <button class="ghost-btn" id="btnAst">Ver arbol AST</button>
        <span class="status" id="estado">Listo</span>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:0; height:100%;">
      <div id="errorsBar" style="border-bottom:1px solid var(--line); padding:10px 16px; background:var(--paper-2); display:flex; align-items:center; gap:12px;">
        <div id="errorSummary" style="font-family:'Courier New',monospace; font-size:13px; color:var(--ink-2);">Sin errores</div>
        <div id="errorBadges" style="margin-left:auto; display:flex; gap:8px; align-items:center;"></div>
      </div>
      <div style="display:flex; gap:0; align-items:stretch; flex:1;">
        <div id="errorsList" style="width:50%; background:var(--term-bg); color:var(--term-text); overflow:auto; padding:12px 14px; font-family:'Courier New',monospace; font-size:13px;">
          <em>Presiona "Compilar" para obtener errores.</em>
        </div>
        <div id="sheetWrap" style="width:50%; padding:12px 14px; background:linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%); overflow:auto;">
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            <div id="sheetTitle" style="font-family:Georgia,serif; font-size:15px; margin-bottom:8px; color:var(--ink);">Partitura</div>
            <button class="run-btn" id="btnPlayAudio" style="font-size:12px; padding:6px 10px;">Reproducir</button>
            <label style="font-family:Courier New,monospace; font-size:12px; color:var(--ink-2);">Tempo</label>
            <input id="tempoRange" type="range" min="60" max="180" value="120" style="width:120px;">
            <span id="tempoValue" class="status" style="min-width:36px; text-align:center;">120</span>
            <select id="instrumentSelect" class="ghost-btn" style="font-size:12px; padding:6px 10px;">
              <option value="PIANO">Piano</option>
              <option value="VIOLIN">Violín</option>
            </select>
            <select id="soundMode" class="ghost-btn" style="font-size:12px; padding:6px 10px;">
              <option value="SYNTH">Síntesis</option>
              <option value="SAMPLES">Samples (si disponibles)</option>
            </select>
            <label style="font-size:12px; color:var(--ink-2);">Humanize</label>
            <input id="humanizeChk" type="checkbox" title="Pequeñas variaciones de tiempo y dinámica para sonar más humano">
            <label style="font-size:12px; color:var(--ink-2);">Chorus</label>
            <input id="chorusChk" type="checkbox">
            <input id="chorusAmount" type="range" min="0" max="100" value="30" style="width:80px;">
            <label style="font-size:12px; color:var(--ink-2);">Swing</label>
            <input id="swingChk" type="checkbox">
            <button class="run-btn" id="btnDownloadMusicXML" style="font-size:12px; padding:6px 10px;">Descargar MusicXML</button>
          </div>
          <div id="sheet" aria-live="polite"></div>
          <div id="astView" style="margin-top:12px; display:none;"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  DSL Musical &mdash; UNA Puno &middot; Compiladores
</footer>

<script src="app.js"></script>
</body>
</html>
